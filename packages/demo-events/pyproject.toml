[project]
name = "demo-events"
version = "0.1.0"
description = "How a Python demo service publishes to the Event Bus."
requires-python = ">=3.12"
dependencies = ["httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_events"]
