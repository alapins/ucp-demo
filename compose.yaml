# The whole demo, brought up by one command:  docker compose up --build
#
# Ordering is by health rather than by start, so that a service is never asked to
# publish to an Event Bus that is not answering yet.

name: invoice-payment-demo

services:
  event-bus:
    build:
      context: .
      dockerfile: services/event-bus/Dockerfile
    ports:
      - "8100:8100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8100/health")
      interval: 2s
      timeout: 3s
      retries: 15

  invoice-api:
    build:
      context: .
      dockerfile: services/invoice-api/Dockerfile
    environment:
      EVENT_BUS_URL: http://event-bus:8100
    ports:
      - "8080:8080"
    depends_on:
      event-bus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  ucp-server:
    build:
      context: .
      dockerfile: services/ucp-server/Dockerfile
    environment:
      EVENT_BUS_URL: http://event-bus:8100
      INVOICE_API_URL: http://invoice-api:8080
      # Which Payer an API key acts for, as `key:email` pairs. The whole of the
      # Agent's authentication: identity linking and OAuth are out of scope, and
      # the key's only job is to scope a Catalog search to one Payer's Invoices.
      UCP_API_KEYS: demo-agent-key:vampserv@gmail.com
    ports:
      - "8000:8000"
    depends_on:
      event-bus:
        condition: service_healthy
      # The UCP Server is an exposure layer over the system of record, so it has
      # nothing to expose until the Invoice API is answering.
      invoice-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health")
      interval: 2s
      timeout: 3s
      retries: 15

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    environment:
      EVENT_BUS_URL: http://event-bus:8100
      UCP_SERVER_URL: http://ucp-server:8000
      # The other half of the pair above: this is what the Agent presents, and it
      # is what tells the Merchant whose Invoices to answer with.
      UCP_API_KEY: demo-agent-key
    ports:
      - "8200:8200"
    depends_on:
      event-bus:
        condition: service_healthy
      # The Agent reaches the Merchant only over UCP, never directly.
      ucp-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8200/health")
      interval: 2s
      timeout: 3s
      retries: 15

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      # Read by the browser, not by the container, so these must be addresses the
      # operator's machine can reach.
      VITE_EVENT_BUS_URL: http://localhost:8100
      VITE_INVOICE_API_URL: http://localhost:8080
      VITE_AGENT_URL: http://localhost:8200
    ports:
      - "5173:5173"
    depends_on:
      event-bus:
        condition: service_healthy
      # The merchant window lists Invoices from the system of record directly.
      invoice-api:
        condition: service_healthy
      # The agent window's Run Agent Now reaches the Agent from the browser, so a
      # window that is up before the Agent is has a button that cannot work.
      agent:
        condition: service_healthy
