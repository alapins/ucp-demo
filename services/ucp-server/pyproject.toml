[project]
name = "ucp-server"
version = "0.1.0"
description = "Exposes the Merchant's Invoices over UCP. Never the system of record."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.12",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "greenlet>=3.0",
    "shortuuid",
    "cryptography>=42",
    "ucp-sdk>=0.4.4",
    "demo-events",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ucp_server"]

[tool.uv.sources]
demo-events = { path = "../../packages/demo-events" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The integration tests drive the whole demo through docker compose. They are not
# part of the red -> green loop; run them with `-m integration`.
markers = ["integration: needs the whole demo running under docker compose"]
addopts = "-m 'not integration'"
