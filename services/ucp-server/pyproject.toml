[project]
name = "ucp-server"
version = "0.1.0"
description = "Exposes the Merchant's Invoices over UCP. Never the system of record."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "demo-events",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ucp_server"]

[tool.uv.sources]
demo-events = { path = "../../packages/demo-events" }
